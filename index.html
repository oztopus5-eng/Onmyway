/* ---------- reading your email, carefully ---------- */
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const DAYNAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
/** Find a date and time in ordinary sentences. Returns null unless it's confident. */
function parseWhen(text, received) {
  const t = (text || "").toLowerCase();
  const isDue = /\b(due|deadline|submit by|turn it in|turn in|hand in|no later than)\b/.test(t);
  const isMeet = /\b(meeting|meet at|meet up|call|appointment|interview|practice|rehearsal|conference|tryout|orientation|recital)\b/.test(t);
  // plain-English invitations, which is how people actually write
  const isInvite = /\b(want to (go|grab|get|come|meet|see|hang)|wanna|are you free|you free|let'?s (go|grab|meet|get|do)|come over|hang out|join me|pick you up|see you at)\b/.test(t)
    || /\b(dinner|lunch|breakfast|brunch|coffee|movie|concert|party|birthday|game|trip|store)\b/.test(t) && /\?|\bthis\b|\bnext\b|\bon\b/.test(t);
  if (!isDue && !isMeet && !isInvite) return null;
  const base = received ? new Date(received) : new Date();
  let d = null, m;
  if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : base.getFullYear();
    d = new Date(y, +m[1] - 1, +m[2]);
  } else if ((m = t.match(new RegExp("\\b(" + MONTHS.join("|") + ")[a-z]*\\.?\\s+(\\d{1,2})\\b")))) {
    d = new Date(base.getFullYear(), MONTHS.indexOf(m[1]), +m[2]);
    if (d.getTime() < base.getTime() - 30 * 864e5) d.setFullYear(d.getFullYear() + 1);
  } else if (/\btomorrow\b/.test(t)) { d = new Date(base); d.setDate(d.getDate() + 1); }
  else if (/\btonight\b|\btoday\b/.test(t)) { d = new Date(base); }
  else if ((m = t.match(new RegExp("\\b(?:this\\s+|next\\s+)?(" + DAYNAMES.join("|") + ")\\b")))) {
    d = new Date(base);
    let add = (DAYNAMES.indexOf(m[1]) - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + (add || 7));
  }
  if (!d || isNaN(d)) return null;
  const clock = parseClock(t);
  const kind = isDue ? "assignment" : "meeting";
  if (clock) d.setHours(clock.h, clock.m, 0, 0);
  else d.setHours(isDue ? 23 : 9, isDue ? 59 : 0, 0, 0);
  if (d.getTime() < Date.now()) return null;
  return { kind, when: d, exact: !!clock };
}

/** Clock times people actually write, including the ones that are words. */
function parseClock(t) {
  let m;
  if (/\bmidnight\b/.test(t)) return { h: 0, m: 0 };
  if (/\bnoon\b|\bmidday\b/.test(t)) return { h: 12, m: 0 };
  if ((m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m|p\.?m)\b/)))
    return { h: (+m[1] % 12) + (m[3][0] === "p" ? 12 : 0), m: m[2] ? +m[2] : 0 };
  if ((m = t.match(/\b(?:at|around|by)\s+(\d{1,2})(?::(\d{2}))?\b/))) {
    let hh = +m[1];
    if (hh >= 1 && hh <= 7) hh += 12;               // "at 4" means the afternoon
    if (hh > 23) return null;
    return { h: hh, m: m[2] ? +m[2] : 0 };
  }
  if (/\bmorning\b/.test(t)) return { h: 9, m: 0 };
  if (/\bafternoon\b/.test(t)) return { h: 15, m: 0 };
  if (/\bevening\b|\btonight\b/.test(t)) return { h: 19, m: 0 };
  return null;
}

/** Plain-language yes and no. Checked in that order — a "sorry, can't" that
 *  also contains "sounds good" should still count as a no. */
const NO_RE = /\b(can'?t make it|cannot make it|won'?t work|does ?n'?t work|not going to work|unable to|have to decline|need to decline|can'?t do|rain ?check|another time|reschedul|no longer)\b/;
const YES_RE = /\b(yes|yep|yeah|yup|sure|sounds good|sounds great|works for me|that works|see you then|see you there|i'?ll be there|i'?ll come|i'?m in|count me in|confirm(ed|ing)?|perfect|will do|happy to|looking forward)\b/;

/**
 * Look through the whole email thread for a message YOU sent after the
 * proposal, and read it as a yes, a no, or neither.
 */
async function readThread(threadId, acct, afterMs, baseDate) {
  const out = { verdict: null, when: null };
  if (!threadId) return out;
  try {
    const t = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/threads/" + threadId +
      "?format=metadata&metadataHeaders=From", acct);
    const me = String(acct.email || "").toLowerCase();
    for (const m of (t.messages || [])) {
      const when = Number(m.internalDate || 0);
      if (afterMs && when && when <= afterMs) continue;      // only what came after the ask
      const H = {}; (m.payload && m.payload.headers || []).forEach(x => H[x.name.toLowerCase()] = x.value);
      const sentByMe = (m.labelIds || []).includes("SENT") || (H.from || "").toLowerCase().includes(me);
      const s = (m.snippet || "").toLowerCase();

      // a later message can pin down the time the first one left vague
      const clock = parseClock(s);
      if (clock && baseDate) {
        const d = new Date(baseDate);
        d.setHours(clock.h, clock.m, 0, 0);
        if (d.getTime() > Date.now()) out.when = d;
      }
      if (!sentByMe) continue;
      if (NO_RE.test(s)) { out.verdict = "no"; return out; }
      if (YES_RE.test(s) && !out.verdict) out.verdict = "yes";
    }
  } catch (e) { console.warn("thread", e); }
  return out;
}

/**
 * Cheap change detector. getProfile costs 1 quota unit and returns a historyId
 * that changes whenever the mailbox does. Poll this often; only run the real
 * scan (which is ~20 requests) when the number actually moved.
 */
let HIST = {}, SCANNING = false, LASTSCAN = 0;
async function pollGmail(force) {
  if (!anyToken() || S.settings.emailScan === false || SCANNING) return;
  let changed = !!force;
  for (const acct of ACCOUNTS) {
    try {
      const p = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/profile", acct);
      if (p.historyId && HIST[acct.email] !== p.historyId) {
        if (HIST[acct.email]) changed = true;      // first read just sets the baseline
        HIST[acct.email] = p.historyId;
      }
    } catch (e) {}
  }
  if (!changed) return;
  if (Date.now() - LASTSCAN < 20000) return;       // never more than once per 20s
  SCANNING = true;
  try { await scanGmail(); } finally { SCANNING = false; LASTSCAN = Date.now(); }
}

/** Explains, in plain words, why a message did or didn't turn into anything. */
function parseWhy(text) {
  const t = (text || "").toLowerCase();
  const hasWord = /\b(due|deadline|meeting|meet|call|appointment|interview|practice|rehearsal|tryout|want to|wanna|are you free|let'?s|dinner|lunch|coffee|movie|party|game|trip|store)\b/.test(t);
  if (!hasWord) return "nothing that sounded like a plan";
  return "sounded like a plan, but no day I could read";
}
let SCANLOG = { at: null, accounts: [], items: [] };

/** Gmail hands the body back base64url, sometimes several layers deep. */
function b64mail(s) {
  try {
    const b = atob(String(s).replace(/-/g, "+").replace(/_/g, "/"));
    return decodeURIComponent(escape(b));
  } catch (e) {
    try { return atob(String(s).replace(/-/g, "+").replace(/_/g, "/")); } catch (x) { return ""; }
  }
}
/** Everything the message actually says — plain text if it has any, otherwise the HTML stripped down. */
function mailBody(msg) {
  let plain = "", html = "";
  (function walk(p) {
    if (!p) return;
    if (p.body && p.body.data) {
      if (p.mimeType === "text/plain") plain += b64mail(p.body.data) + "\n";
      else if (p.mimeType === "text/html") html += b64mail(p.body.data) + "\n";
    }
    (p.parts || []).forEach(walk);
  })(msg.payload);
  let out = plain.trim();
  if (!out && html) {
    out = html
      .replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<script[\s\S]*?<\/script>/gi, " ")
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/(p|div|tr|li|h[1-6])>/gi, "\n")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  }
  return out.replace(/^[>|].*$/gm, "")            // drop quoted replies
    .replace(/\n{3,}/g, "\n\n").replace(/[ \t]{2,}/g, " ")
    .trim().slice(0, 4000);
}

async function scanGmail() {
  if (!anyToken() || S.settings.emailScan === false) return;
  const dropped = Store.get("omw_dismissed", {});
  const found = [], autoAdd = [];
  SCANLOG = { at: Date.now(), accounts: [], items: [] };
  for (const acct of ACCOUNTS) {
    const tag = "m" + Math.abs(hashStr(acct.email)) + "_";
    try {
      const l = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=18&q=" +
        encodeURIComponent("newer_than:10d -category:promotions -category:social"), acct);
      SCANLOG.accounts.push({ email: acct.email, count: (l.messages || []).length, error: null });
      for (const msg of (l.messages || []).slice(0, 18)) {
        const id = tag + msg.id;
        if (dropped[id] || S.banned[id] || S.events.some(e => e.id === id)) continue;
        let d;
        try {
          d = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/messages/" + msg.id +
            "?format=full", acct);
        } catch (e) { console.warn("message", e); continue; }
        const H = {}; (d.payload && d.payload.headers || []).forEach(x => H[x.name.toLowerCase()] = x.value);
        const blob = (H.subject || "") + ". " + (mailBody(d) || d.snippet || "");
        const hit = parseWhen(blob, H.date);
        if (!hit) { SCANLOG.items.push({ subject: H.subject || "(no subject)", why: parseWhy(blob) }); continue; }
        const item = {
          id, src: "gmail", account: acct.email, kind: hit.kind, title: H.subject || "(no subject)",
          start: hit.when.toISOString(),
          who: (H.from || "").replace(/<[^>]*>/, "").replace(/"/g, "").trim() || null,
          why: "From email: " + (d.snippet || "").slice(0, 170)
        };
        if (hit.kind === "meeting") {
          let th = { verdict: null, when: null };
          try { th = await readThread(msg.threadId, acct, Number(d.internalDate || 0), hit.when); }
          catch (e) { console.warn("thread read", e); }
          if (th.when) {                              // a reply nailed down the time
            item.start = th.when.toISOString();
            item.why = "Time taken from a later reply. " + item.why;
          }
          const verdict = S.settings.autoAccept === false ? null : th.verdict;
          if (verdict === "no") {                       // you turned it down — stop asking
            dropped[id] = 1; Store.set("omw_dismissed", dropped);
            SCANLOG.items.push({ subject: item.title, why: "you replied that you can't make it" });
            continue;
          }
          if (verdict === "yes") {
            item.src = "gmail-auto"; item.auto = true;
            item.why = "Added on its own because you replied yes. " + item.why;
            autoAdd.push(item);
            SCANLOG.items.push({ subject: item.title, why: "added — you replied yes" });
            continue;
          }
        }
        found.push(item);
        SCANLOG.items.push({ subject: item.title, why: "suggested, waiting on you" });
      }
    } catch (e) {
      console.warn("gmail", acct.email, e);
      const rec = SCANLOG.accounts.find(a => a.email === acct.email);
      const msg = String(e.message) === "401" ? "sign-in expired, tap to reconnect" : "error " + e.message;
      rec ? (rec.error = msg) : SCANLOG.accounts.push({ email: acct.email, count: 0, error: msg });
    }
  }
  S.suggestions = found;
  if (autoAdd.length) {
    S.events = S.events.concat(autoAdd);
    save();
    await rescheduleAll();
    autoAdd.forEach(e => pushLocal("auto_" + e.id, "Added to your day",
      e.title + " — " + fmtDay(e.start) + " at " + fmtTime(e.start) + ", because you replied yes"));
  }
  save(); renderHome();
}

}

/* ---------- the queue the service worker reads ---------- */
const IDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej("unsupported");
    const r = indexedDB.open("omw", 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("q")) r.result.createObjectStore("q", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    async sync(items) {
      try {
        const db = await open(), tx = db.transaction("q", "readwrite"), st = tx.objectStore("q");
        const old = await new Promise(r => { const g = st.getAll(); g.onsuccess = () => r(g.result || []); g.onerror = () => r([]); });
        const sent = {}; old.forEach(o => { if (o.sent) sent[o.id] = o.sent; });
        st.clear();
        items.forEach(i => st.put(Object.assign({}, i, { sent: sent[i.id] || null })));
        return new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
      } catch (e) {}
    },
    async sentIds() {
      try {
        const db = await open();
        return await new Promise(r => {
          const g = db.transaction("q", "readonly").objectStore("q").getAll();
          g.onsuccess = () => r((g.result || []).filter(x => x.sent).map(x => x.id));
          g.onerror = () => r([]);
        });
      } catch (e) { return []; }
    }
  };
})();
/* ---------- push: the worker pokes us when something is due ---------- */
let PUSHSUB = null, PUSHOK = false;
const u8 = s => {
  const p = "=".repeat((4 - s.length % 4) % 4);
  const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
};

async function enablePush() {
  if (!SWREG || !hasWorker()) return false;
  if (!("PushManager" in window)) return false;
  try {
    if (Notification.permission !== "granted") return false;
    let sub = await SWREG.pushManager.getSubscription();
    if (!sub) {
      const r = await fetch(workerBase() + "/pubkey");
      const { key } = await r.json();
      if (!key) return false;
      sub = await SWREG.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(key) });
    }
    PUSHSUB = sub; PUSHOK = true;
    await pushSync();
    return true;
  } catch (e) { console.warn("push", e); return false; }
}

/** Send the worker nothing but a list of timestamps. */
let pushTimer = null;
function pushSync() {
  if (!PUSHSUB || !hasWorker()) return Promise.resolve();
  clearTimeout(pushTimer);
  return new Promise(res => {
    pushTimer = setTimeout(async () => {
      try {
        // cron only runs on the minute, so ask to be woken at the minute
        // boundary before each alert. The service worker then waits out the
        // remaining seconds itself, so the alert lands on the exact moment
        // instead of up to a minute late.
        const times = upcoming()
          .filter(e => e.alertAt && !S.fired[e.id] && alertsOn(e))
          .map(e => Math.floor(new Date(e.alertAt).getTime() / 60000) * 60000)
          .filter(t => t > Date.now() - 60000)
          .sort((a, b) => a - b).slice(0, 60);
        await fetch(workerBase() + "/subscribe", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ sub: PUSHSUB.toJSON(), times })
        });
      } catch (e) {}
      res();
    }, 900);
  });
}

async function testPush() {
  if (!PUSHSUB) { toast("Background alerts aren't on yet"); return; }
  toast("Asking the worker to poke this device…");
  try {
    const r = await fetch(workerBase() + "/testpush", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ endpoint: PUSHSUB.endpoint })
    });
    const d = await r.json();
    toast(d.ok ? "Sent — close the app and it should arrive" : "Worker said: " + (d.error || d.status));
  } catch (e) { toast("Couldn't reach the worker"); }
}

function queueToIDB() {
  try {
    const items = upcoming().filter(e => e.alertAt && !S.fired[e.id] && alertsOn(e)).slice(0, 40).map(e => {
      const t = notifTemplate(e);
      return {
        id: e.id, title: t.title, body: t.body,
        at: new Date(e.alertAt).getTime(),
        start: new Date(e.start).getTime(),
        urgent: e.kind !== "assignment"
      };
    });
    IDB.sync(items);
    pushSync();
  } catch (e) {}
}

  const dir = ORDER[s] > ORDER[SCREEN] ? 1 : -1;
  SCREEN = s; SWAPPING = true;
  $("navCal").classList.toggle("on", s === "cal");
  $("navSet").classList.toggle("on", s === "set");
  paint(s);                                        // fill it before anyone sees it

  cur.style.setProperty("--dx", dir);
  next.style.setProperty("--dx", dir);
  cur.classList.add("leaving");
  cur.style.animation = "screenOut .19s ease forwards";
  next.classList.remove("hide");
  next.style.animation = "none"; void next.offsetHeight;   // restart the animation
  next.style.animation = "screenIn .34s cubic-bezier(.2,.7,.3,1) both";
  window.scrollTo(0, 0);
  setTimeout(() => {
    cur.classList.add("hide");
    cur.classList.remove("leaving");
    cur.style.animation = "";
    SWAPPING = false;
  }, 200);
}

/* ---------- HOME ---------- */
function upcoming() {
  const cut = Date.now() - 30 * MIN;
  return S.events.filter(e => new Date(e.start).getTime() > cut && !S.banned[e.id])
    .concat(routineEvents().filter(e => !S.banned[e.id]))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}
function routineEvents() {
  if (!S.settings.routines) return [];
  const out = [];
  for (let d = 0; d < 7; d++) {
    const day = new Date(); day.setDate(day.getDate() + d);
    S.routines.forEach(r => {
      if (!r.days.includes(day.getDay())) return;
      const [h, m] = r.time.split(":").map(Number);
      const dt = new Date(day); dt.setHours(h, m, 0, 0);
      if (dt.getTime() < Date.now() - 20 * MIN) return;
      out.push({ id: "r_" + r.id + "_" + dt.toDateString(), kind: "routine", src: "routine", title: r.title, start: dt.toISOString(), alertAt: dt.toISOString(), reason: "Daily reminder" });
    });
  }
  return out;
}

/** OSRM gives real turn instructions. Free, no key. */
function stepText(s) {
  const m = s.maneuver || {}, road = s.name || "";
  const dir = { left: "left", right: "right", "slight left": "slightly left", "slight right": "slightly right",
    "sharp left": "sharp left", "sharp right": "sharp right", straight: "straight", uturn: "around" }[m.modifier] || m.modifier || "";
  const on = road ? " onto " + road : "";
  switch (m.type) {
    case "depart": return "Set off" + (road ? " on " + road : "");
    case "arrive": return "Arrive";
    case "turn": return "Turn " + dir + on;
    case "new name": return "Continue" + (road ? " on " + road : "");
    case "merge": return "Merge " + dir + on;
    case "on ramp": return "Take the ramp" + on;
    case "off ramp": return "Take the exit" + on;
    case "fork": return "Keep " + dir + on;
    case "roundabout": case "rotary": return "Take the roundabout" + (m.exit ? ", exit " + m.exit : "") + on;
    case "continue": return "Continue " + dir + on;
    default: return (dir ? "Head " + dir : "Continue") + on;
  }
}
const dist = m => m < 950 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1) + " km";

async function showSteps(ev) {
  const host = document.getElementById("stepbox");
  const here = ORIGIN || S.home;
  if (!host || !here || !ev.place || !ev.place.lat) return;
  try {
    const u = "https://router.project-osrm.org/route/v1/driving/" +
      here.lng.toFixed(5) + "," + here.lat.toFixed(5) + ";" +
      ev.place.lng.toFixed(5) + "," + ev.place.lat.toFixed(5) + "?overview=false&steps=true";
    const d = await (await fetch(u)).json();
    if (d.code !== "Ok" || !d.routes[0]) { host.innerHTML = ""; return; }
    const steps = d.routes[0].legs[0].steps || [];
    if (steps.length < 2) { host.innerHTML = ""; return; }
    host.innerHTML = `<div class="eyebrow">Directions</div>
      <div class="group">${steps.map(s => `<div class="row" style="padding:11px 15px">
        <div class="row-txt"><div class="row-t" style="font-size:14px;font-weight:500">${esc(stepText(s))}</div>
        ${s.distance > 25 ? `<div class="row-s">${dist(s.distance)}</div>` : ""}</div></div>`).join("")}</div>
      <div class="note">${dist(d.routes[0].distance)} · about ${Math.round(d.routes[0].duration / 60)} min without traffic</div>`;
  } catch (e) { host.innerHTML = ""; }
}

async function drawMap(ev) {
  const host = document.getElementById("mapbox");
  if (!host || !ev.place || !ev.place.lat) return;
  let L;
  try { L = await loadLeaflet(); } catch (e) { host.remove(); return; }
  if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; }

  const dest = [ev.place.lat, ev.place.lng];
  const here = (ORIGIN || S.home) ? [(ORIGIN || S.home).lat, (ORIGIN || S.home).lng] : null;
  MAP = L.map(host, { zoomControl: false, attributionControl: true }).setView(dest, 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "© OpenStreetMap"
  }).addTo(MAP);

  const dot = (color, r) => L.divIcon({
    className: "", iconSize: [r * 2, r * 2], iconAnchor: [r, r],
    html: `<div style="width:${r * 2}px;height:${r * 2}px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)"></div>`
  });

  const marker = L.marker(dest, { icon: dot("#D96A62", 9), draggable: true }).addTo(MAP);
  marker.on("dragend", () => {
    const p = marker.getLatLng();
    S.geo[geoKey(ev.place.name)] = { lat: p.lat, lng: p.lng, pinned: true, label: "Placed by hand" };
    S.events.forEach(x => { if (x.place && geoKey(x.place.name) === geoKey(ev.place.name)) { x.place.lat = p.lat; x.place.lng = p.lng; x.place.rough = false; x.place.pinned = true; } });
    save(); Sound.on(); toast("Moved — that's where it is now");
    rescheduleAll().then(renderHome);
  });

  if (here) {
    L.marker(here, { icon: dot("#6FA890", 7) }).addTo(MAP);
    MAP.fitBounds(L.latLngBounds([here, dest]).pad(0.3));
    try {                                        // the actual road route, from OSRM
      const u = "https://router.project-osrm.org/route/v1/driving/" +
        here[1].toFixed(5) + "," + here[0].toFixed(5) + ";" +
        dest[1].toFixed(5) + "," + dest[0].toFixed(5) + "?overview=full&geometries=geojson";
      const d = await (await fetch(u)).json();
      if (d.code === "Ok" && d.routes[0]) {
        const line = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        L.polyline(line, { color: "#D96A62", weight: 4, opacity: .85 }).addTo(MAP);
        MAP.fitBounds(L.latLngBounds(line).pad(0.15));
      }
    } catch (e) {}
  }
  setTimeout(() => { try { MAP.invalidateSize(); } catch (e) {} }, 120);
}

/* ---------- SHEET ---------- */
/**
 * If a sheet is already open, swap its contents rather than tearing it down
 * and animating a new one in — otherwise every toggle makes the panel blink.
 * Scroll position is kept so you stay where you were.
 */
function sheet(html) {
  const host = $("sheetHost");
  const cur = host.querySelector(".sheet");
  if (cur) {
    const y = cur.scrollTop;
    cur.innerHTML = `<div class="grab"></div>${html}`;
    cur.scrollTop = y;
    return;
  }
  host.innerHTML = `<div class="scrim" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div>${html}</div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; }
  const host = $("sheetHost");
  const sh = host.querySelector(".sheet"), sc = host.querySelector(".scrim");
  if (!sh) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
  Sound.back();
  sh.classList.add("closing"); if (sc) sc.classList.add("closing");
  setTimeout(() => { host.innerHTML = ""; document.body.style.overflow = ""; }, 250);
}

/* ---------- CALENDAR ---------- */
let CAL = new Date(), SEL = new Date();
function renderCal() {
  const y = CAL.getFullYear(), m = CAL.getMonth();
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const all = upcoming();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dim = d.getMonth() !== m, today = sameDay(d, new Date()), sel = sameDay(d, SEL);
    const n = all.filter(e => sameDay(e.start, d)).length;
    cells += `<button class="day${dim ? " dim" : ""}${today ? " today" : ""}${sel ? " sel" : ""}" onclick="pickDay('${d.toISOString()}')">
      <span>${d.getDate()}</span><span class="pips">${Array(Math.min(n, 3)).fill('<i class="pip"></i>').join("")}</span></button>`;
  }
  const dayEvents = all.filter(e => sameDay(e.start, SEL));
  $("scr-cal").innerHTML = `
    <div class="cal-head">
      <div class="cal-title">${CAL.toLocaleDateString([], { month: "long", year: "numeric" })}</div>
      <button class="iconbtn" onclick="shiftMonth(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="iconbtn" onclick="shiftMonth(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="grid">${["S", "M", "T", "W", "T", "F", "S"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;letter-spacing:.04em">swipe for another month</div>
    <div class="eyebrow">${fmtDay(SEL)}</div>
    ${dayEvents.length ? dayEvents.map(e => `<div class="item"><button class="card" onclick="openDetail('${e.id}')">
        <div class="card-t">${esc(e.title)}</div>
        <div class="card-s">${fmtTime(e.start)}${e.place && e.place.name ? " · " + esc(e.place.name) : ""}</div>
        <span class="tag t-${e.kind}">${e.kind}</span></button></div>`).join("")
      : `<div class="empty"><p style="margin:0">Nothing on this day.</p></div>`}
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="addForm()">Add to this day</button>
      <button class="btn ghost" style="flex:1" onclick="openMapAll()">See the map</button>
    </div>
    <div style="height:26px"></div>`;
}
function setTab(t) { TAB = t; Sound.tap(); renderHome(); }
function pickDay(iso) { SEL = new Date(iso); Sound.tap(); renderCal(); }
function shiftMonth(n) {
  CAL.setMonth(CAL.getMonth() + n);
  $("scr-cal").style.setProperty("--cdx", n > 0 ? 1 : -1);
  Sound.tap(); renderCal();
}

/* drag the calendar sideways to change month */
(function calSwipe() {
  const el = document.getElementById("scr-cal");
  if (!el) return;
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener("touchend", e => {
    if (x0 == null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    shiftMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

let PICKED = null, suggTimer = null;
/** Live place search, straight off OpenStreetMap. */
function suggestPlaces(q) {
  PICKED = null;
  clearTimeout(suggTimer);
  const box = $("f_sugg");
  if (!box) return;
  if (!q || q.trim().length < 3) { box.innerHTML = ""; return; }
  suggTimer = setTimeout(async () => {
    try {
      const near = ORIGIN || S.home;
      let u = "https://photon.komoot.io/api/?limit=5&q=" + encodeURIComponent(q.trim());
      if (near) u += "&lat=" + near.lat.toFixed(4) + "&lon=" + near.lng.toFixed(4);
      const d = await (await fetch(u)).json();
      const rows = (d.features || []).map(f => {
        const p = f.properties || {};
        const label = [p.name, p.street && (p.housenumber ? p.housenumber + " " + p.street : p.street), p.city, p.state]
          .filter(Boolean).join(", ");
        return { label, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
      }).filter(r => r.label);
      if (!rows.length) { box.innerHTML = ""; return; }
      box.innerHTML = `<div class="group" style="margin-top:8px">` + rows.map((r, i) =>
        `<button class="row" onclick="usePlace(${i})"><div class="row-ico">${ICONS.pin}</div>
         <div class="row-txt"><div class="row-t" style="font-size:14px">${esc(r.label)}</div></div></button>`).join("") + `</div>`;
      box.dataset.rows = JSON.stringify(rows);
    } catch (e) { box.innerHTML = ""; }
  }, 350);
}
function usePlace(i) {
  const box = $("f_sugg");
  const rows = JSON.parse(box.dataset.rows || "[]");
  const r = rows[i]; if (!r) return;
  PICKED = r;
  $("f_p").value = r.label;
  box.innerHTML = "";
  S.geo[geoKey(r.label)] = { lat: r.lat, lng: r.lng, label: r.label };
  save(); Sound.tap();
}

async function saveNew() {
  const t = $("f_t").value.trim(); if (!t) { toast("Give it a name"); return; }
  const start = new Date($("f_d").value + "T" + $("f_h").value);
  const p = $("f_p").value.trim(), w = $("f_w").value.trim();
  const place = p ? (PICKED && PICKED.label === p
    ? { name: p, lat: PICKED.lat, lng: PICKED.lng }
    : { name: p }) : null;
  PICKED = null;
  S.events.push({ id: "u_" + Date.now(), src: "manual", kind: $("f_k").value, title: t, start: start.toISOString(), place, who: w || null });
  await rescheduleAll(); closeSheet(); Sound.on(); toast("Added"); renderCal(); renderHome();
}

function myOrigin() { return location.origin; }

let STEPMSG = {}, STEPOPEN = {};
function toggleStep(id) { STEPOPEN[id] = !STEPOPEN[id]; Sound.tap(); openSetup(); }
function openSetup() {
  Sound.open();
  const body = STEPS.map((s, i) => {
    const done = S.setup[s.id], m = STEPMSG[s.id];
    const copies = (s.copies || []).map(([label, v], ci) => {
      const val = typeof v === "function" ? v() : v;
      return `<div class="copyrow"><code>${esc(val)}</code><button onclick="copyStep(${i},${ci})">Copy</button></div>
        <div class="caplbl">${esc(label)}</div>`;
    }).join("");
    const links = (s.links || []).map(([label, u]) => {
      const href = typeof u === "function" ? u() : u;
      if (href === "#keys") return `<button onclick="closeSheet();setTimeout(openKeys,320)">${esc(label)}</button>`;
      if (href === "#set") return `<button onclick="closeSheet();go('set')">${esc(label)}</button>`;
      return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
    }).join("");
    return `<div class="step${done ? " done" : ""}">
      <div class="step-h"><div class="step-n">${done ? "&#10003;" : i + 1}</div><div class="step-t">${esc(s.t)}</div></div>
      <div class="step-b">${s.b}</div>
      ${copies}
      ${STEPOPEN[s.id] ? `<div class="step-d">${(STEPDETAIL[s.id] || []).map((line, li) =>
        `<div class="dline"><span class="dnum">${li + 1}</span><span>${line}</span></div>`).join("")}</div>` : ""}
      <div class="step-go">${links}
        <button onclick="toggleStep('${s.id}')">${STEPOPEN[s.id] ? "Hide the detail" : "Show me exactly"}</button>
        <button class="check" onclick="checkStep('${s.id}')">Check</button></div>
      ${m ? `<div class="step-msg ${m.ok ? "ok" : "bad"}">${esc(m.msg)}</div>` : ""}
    </div>`;
  }).join("");
  const done = STEPS.filter(s => S.setup[s.id]).length;
  sheet(`<div class="eyebrow" style="margin-top:0">Setup</div><h2>Run this on your own accounts</h2>
    <div class="note" style="margin:6px 0 14px">${done} of ${STEPS.length} done. Everything lives on accounts you own — your calendar and mail never pass through anyone else's server, including whoever sent you the link.</div>
    ${body}
    <div class="note" style="margin-top:6px">About half an hour. Nothing here costs anything, and nothing asks for a card.</div>
    <div style="height:16px"></div>`);
}

async function copyStep(i, ci) {
  const v = STEPS[i].copies[ci][1];
  const val = String(typeof v === "function" ? v() : v);
  try { await navigator.clipboard.writeText(val); Sound.on(); toast("Copied"); }
  catch (e) { toast("Press and hold the box to copy it"); }
}

async function checkStep(id) {
  const s = STEPS.find(x => x.id === id); if (!s) return;
  Sound.tap();
  STEPMSG[id] = { ok: false, msg: "Checking…" };
  openSetup();
  let r;
  try { r = await s.test(); } catch (e) { r = { ok: false, msg: "Something went wrong checking that." }; }
  STEPMSG[id] = r;
  if (r.ok) { S.setup[id] = true; save(); Sound.on(); } else Sound.off();
  openSetup();
  renderSettings();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { if (!b.type) b.type = "button"; e.preventDefault(); }
  const a = e.target.closest('a[href^="#"]');
  if (a) e.preventDefault();
}, true);
document.addEventListener("submit", e => e.preventDefault(), true);
document.addEventListener("click", e => {
  if (e.target.closest(".card,.iconbtn,.btn,.row,.day,.sw") && !Sound.busy()) Sound.tap();
});
// browsers won't start audio until you touch the screen once
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => Sound.prime(), { once: true, passive: true }));
$("ver").textContent = "v" + VERSION;

let SWREG = null, BG = false, INSTALL = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL = e; if (SCREEN === "set") renderSettings(); });
function installApp() {
  if (INSTALL) { INSTALL.prompt(); INSTALL = null; return; }
  if (BG) { toast("Already on — alerts arrive with the app closed"); return; }
  toast("Open your browser menu and choose Add to Home Screen");
}
async function forceUpdate() {
  toast("Fetching the newest build");
  try {
    if ("caches" in window) for (const k of await caches.keys()) await caches.delete(k);
    if (navigator.serviceWorker) {
      const rs = await navigator.serviceWorker.getRegistrations();
      for (const r of rs) await r.unregister();
    }
  } catch (e) {}
  location.replace(location.pathname + "?u=" + Date.now());
}
async function initSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  try {
    SWREG = await navigator.serviceWorker.register("./sw.js");
    navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open) openDetail(e.data.open); });
    if ("periodicSync" in SWREG) {
      try {
        const st = await navigator.permissions.query({ name: "periodic-background-sync" });
        if (st.state === "granted") { await SWREG.periodicSync.register("omw-check", { minInterval: 15 * 60000 }); BG = true; }
      } catch (e) {}
    }
    if (S.paired.notifications) enablePush().then(() => renderSettings());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && SWREG && SWREG.active) SWREG.active.postMessage("check");
      if (!document.hidden && SWREG) SWREG.update().catch(() => {});
    });
    SWREG.update().catch(() => {});
    SWREG.addEventListener("updatefound", () => {
      const w = SWREG.installing;
      if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) {
          toast("New version ready — open What's new to load it");
        }
      });
    });
  } catch (e) { console.warn("sw", e); }
}

/** Hold the opening until the app has something to show, but never for long. */
let splashGone = false;
function dropSplash(force) {
  const sp = document.getElementById("splash");
  if (!sp || splashGone) return;
  splashGone = true;
  setTimeout(() => {
    sp.classList.add("gone");
    setTimeout(() => { sp.remove(); }, 460);
  }, force ? 0 : 120);
}
function splashNote(t) {
  const n = document.getElementById("sp-note");
  if (n) n.textContent = t || "";
}

/* a hairline that fills while anything is syncing */
let busyN = 0;
function busy(on) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  const b = document.getElementById("loadbar");
  if (b) b.classList.toggle("on", busyN > 0);
}

(async function boot() {
  applyLook();
  const bootStart = Date.now();
  const held = ms => new Promise(r => setTimeout(r, Math.max(0, ms - (Date.now() - bootStart))));
  try {
    if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", () => { if (S.look.theme === "auto") applyLook(); });
  } catch (e) {}
  if (readSetupLink()) setTimeout(() => toast("Ready — open Settings and tap Pair"), 1500);
  initSW();
  splashNote("Getting your schedule");
  await catchWorkerReturn();
  if (!S.onboarded) startTutorial(false);
  if (S.paired.location && navigator.permissions) {
    try { const st = await navigator.permissions.query({ name: "geolocation" }); if (st.state === "granted") pairLocation(); } catch (e) {}
  }
  if (S.paired.maps && S.keys.mapsKey) pairMaps();
  await rescheduleAll();
  renderHome();
  await held(1250);            // never flash past, never linger
  splashNote("");
  dropSplash();
  if (S.settings.weather) loadWeather();
  if (S.settings.sports) loadSports();
  if (!S.installedAt) S.installedAt = {};
  if (!S.installedAt[VERSION]) { S.installedAt[VERSION] = Date.now(); save(); }
  if (S.readVersion !== VERSION && S.seenVersion === VERSION) showNewDot();
  if (!S.seenVersion) { S.seenVersion = VERSION; S.readVersion = VERSION; save(); }   // first ever run, stay quiet
  else if (S.seenVersion !== VERSION) {
    S.seenVersion = VERSION; save();
    NEWDOT = true; showNewDot();
    setTimeout(() => { markNewSeen(); openChanges(true); }, 2000);  // let the opening finish first
  }

  const hash = location.hash.match(/e=([^&]+)/);
  if (hash) setTimeout(() => openDetail(decodeURIComponent(hash[1])), 400);
  setInterval(tick, 20000);
  setInterval(() => { if (S.settings.sports) loadSports(); if (S.settings.weather) loadWeather(); }, 10 * 60000);
  syncFeeds().then(renderHome);
  setInterval(() => syncFeeds().then(renderHome), 20 * 60000);
  setInterval(() => { if (anyToken()) syncGoogle().then(renderHome); }, 4 * 60000);
  setInterval(() => { if (anyToken() || S.vault.length) refreshAll(); }, 40 * 60000);   // ahead of the 1h expiry
  setInterval(() => pollGmail(), 30000);                  // 1 unit per account
  setInterval(() => pollGmail(true), 10 * 60000);         // safety net
  document.addEventListener("visibilitychange", async () => {   // you just opened it
    if (document.hidden) return;
    if (!anyToken() && (S.accounts || []).length) await refreshAll();
    if (!anyToken()) return;
    pollGmail(true);
    syncGoogle().then(renderHome);
  });
  if (S.vault.length && !anyToken()) refreshAll().then(ok => { if (ok) { syncGoogle().then(renderHome); renderSettings(); } });
  if ((S.accounts || []).length && !S.vault.length && !anyToken()) {   // reconnect on launch
    setTimeout(async () => {
      if (await refreshAll()) { toast("Reconnected"); await syncGoogle(); renderHome(); }
    }, 1200);
  }
})();

</script>
</body>
</html>
