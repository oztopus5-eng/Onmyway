<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF7F6">
<title>On My Way</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On My Way">
<meta name="description" content="Tells you when to leave, not when things start.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCF7F6;
  --card:#FFFFFF;
  --ink:#2E2427;
  --muted:#7C6C6E;
  --line:#F2E3E1;
  --iris:#D96A62;
  --iris-soft:#FDEEEC;
  --mint:#6FA890;
  --mint-soft:#E9F3EF;
  --amber:#CE8F45;
  --amber-soft:#FBF0E2;
  --coral:#B4433A;
  --coral-soft:#F9E4E1;
  --shadow:0 1px 2px rgba(46,36,39,.04), 0 8px 24px rgba(46,36,39,.06);
  --shadow-lg:0 2px 6px rgba(46,36,39,.06), 0 20px 48px rgba(46,36,39,.11);
  --r:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- app frame ---------- */
#app{position:relative;max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(28px + var(--safe-b))}
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;
  background:rgba(252,247,246,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px;letter-spacing:-.03em;flex:1}
.brand span{color:var(--iris)}
.iconbtn{
  width:42px;height:42px;border-radius:14px;background:var(--card);
  display:grid;place-items:center;box-shadow:var(--shadow);
  transition:transform .12s ease, background .15s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn.on{background:var(--iris);color:#fff}
.iconbtn svg{width:20px;height:20px;stroke-width:1.9}

.screen{padding:4px 16px 0;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
.screen.leaving{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:1}
@keyframes screenOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(calc(var(--dx,1) * -16px))}}
@keyframes screenIn{from{opacity:0;transform:translateX(calc(var(--dx,1) * 16px))}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hide{display:none!important}

.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 10px;
}
.eyebrow:first-child{margin-top:8px}

/* ---------- hero: the departure ring ---------- */
.hero{
  background:var(--card);border-radius:26px;padding:22px 20px 20px;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;inset:0;border-radius:26px;border:1px solid var(--line);pointer-events:none}
.hero-top{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg);width:104px;height:104px}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--line);stroke-width:9}
.ring .fill{stroke:var(--iris);stroke-width:9;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1),stroke .4s}
.ring-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-num{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;line-height:1;letter-spacing:-.04em}
.ring-unit{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hero-what{min-width:0}
.hero-kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--iris);margin-bottom:5px}
.hero-title{font-size:21px;line-height:1.15;margin-bottom:6px;overflow-wrap:anywhere}
.hero-sub{font-size:13.5px;color:var(--muted);line-height:1.4}
.hero-leave{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.leave-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.leave-time{font-family:"Bricolage Grotesque";font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1}
.leave-why{font-size:12.5px;color:var(--muted);width:100%;margin-top:7px}
.hero.urgent .fill{stroke:var(--coral)} .hero.urgent .leave-time{color:var(--coral)} .hero.urgent .hero-kind{color:var(--coral)}
.hero.soon .fill{stroke:var(--amber)} .hero.soon .leave-time{color:var(--amber)} .hero.soon .hero-kind{color:var(--amber)}

/* ---------- timeline list ---------- */
.tl{position:relative;padding-left:66px}
.tl::before{content:"";position:absolute;left:57px;top:6px;bottom:16px;width:1.5px;background:var(--line)}
.item{position:relative;margin-bottom:10px;animation:rise .3s both}
.item-time{
  position:absolute;left:-66px;top:14px;width:50px;text-align:right;
  font-size:13px;font-weight:700;color:var(--muted);line-height:1.2;
}
.item-time small{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.dot{position:absolute;left:-13.5px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--iris);z-index:2}
.dot.done{background:var(--line);border-color:var(--line)}
.card{
  background:var(--card);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--shadow);border:1px solid var(--line);
  transition:transform .12s ease;width:100%;text-align:left;display:block;
}
.card:active{transform:scale(.985)}
.card-t{font-weight:600;font-size:15.5px;line-height:1.25;margin-bottom:3px;overflow-wrap:anywhere}
.card-s{font-size:12.5px;color:var(--muted);line-height:1.35}
.tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:7px;margin-top:8px;
}
.t-meeting{background:var(--iris-soft);color:var(--iris)}
.t-assignment{background:var(--amber-soft);color:var(--amber)}
.t-routine{background:var(--mint-soft);color:var(--mint)}
.t-game{background:#F4ECEA;color:#7C6C6E}
.item.past .card{opacity:.5}

/* ---------- strips ---------- */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;min-width:132px;box-shadow:var(--shadow);
}
.chip-k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chip-v{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.chip-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}

/* ---------- empty ---------- */
.empty{
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:26px 20px;text-align:center;
}
.empty h3{font-size:17px;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--muted);margin:0 0 14px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--iris);color:#fff;font-weight:600;font-size:15px;
  padding:13px 20px;border-radius:15px;transition:transform .12s,filter .15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- settings ---------- */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:13px;padding:14px 15px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--iris-soft);color:var(--iris)}
.row-ico svg{width:18px;height:18px;stroke-width:2}
.row-txt{flex:1;min-width:0}
.row-t{font-weight:600;font-size:14.5px;line-height:1.25}
.row-s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.row-ico{border:0}
.sw{border:0;padding:0;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .22s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--iris)} .sw.on::after{transform:translateX(20px)}
.sw.off{opacity:.5}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--mint-soft);color:var(--mint);flex:none}
.pill.no{background:#EEF1F7;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;padding:0 4px;margin-top:10px}
.field{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;margin-top:8px;color:var(--ink)}
.field:focus{outline:2px solid var(--iris);outline-offset:1px;border-color:transparent}
label.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-top:14px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-title{flex:1;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:6px}
.day{
  aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:14px;font-weight:600;background:var(--card);border:1px solid var(--line);position:relative;
}
.day.dim{background:transparent;border-color:transparent;color:#CBB6B3}
.day.today{border-color:var(--iris);color:var(--iris)}
.day.sel{background:var(--iris);border-color:var(--iris);color:#fff}
.day .pips{display:flex;gap:2.5px;height:4px}
.pip{width:4px;height:4px;border-radius:50%;background:var(--iris)}
.day.sel .pip{background:#fff}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(46,36,39,.32);backdrop-filter:blur(2px);z-index:60;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--paper);border-radius:26px 26px 0 0;
  padding:8px 18px calc(24px + var(--safe-b));max-height:90vh;overflow-y:auto;
  animation:up .3s cubic-bezier(.2,.8,.3,1) both;box-shadow:0 -10px 40px rgba(46,36,39,.14);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.closing{animation:down .26s cubic-bezier(.45,0,.75,.3) forwards}
.scrim.closing{animation:unfade .26s ease forwards}
@keyframes down{to{transform:translateY(100%)}}
@keyframes unfade{to{opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:22px;line-height:1.15;margin-bottom:6px;overflow-wrap:anywhere}
.detail-meta{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.detail-meta:last-of-type{border-bottom:0}
.dm-k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);width:74px;flex:none;padding-top:3px}
.dm-v{flex:1;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.why{font-size:13px;color:var(--muted);line-height:1.55;font-style:italic;margin-top:4px}

/* ---------- tutorial ---------- */
#tut{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column}
.tut-in{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%;padding:32px 26px;will-change:opacity,transform}
@keyframes tutOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(calc(var(--td,1) * -30px))}}
@keyframes tutIn{from{opacity:0;transform:translateX(calc(var(--td,1) * 30px))}to{opacity:1;transform:none}}
.tut-in .tut-step{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:.05s}
.tut-in .tut-h{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:.11s}
.tut-in .tut-p{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:.17s}
.tut-art svg{animation:artIn .62s cubic-bezier(.2,.8,.3,1) both}
@keyframes artIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
#tut{transition:opacity .44s ease,transform .44s cubic-bezier(.3,.8,.3,1)}
#tut.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.tut-art{height:190px;display:grid;place-items:center;margin-bottom:30px}
.tut-step{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--iris);margin-bottom:12px}
.tut-h{font-size:31px;line-height:1.08;margin-bottom:14px}
.tut-p{font-size:15.5px;color:var(--muted);line-height:1.55;margin:0}
.tut-foot{padding:0 26px calc(30px + var(--safe-b));max-width:520px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:7px;flex:1}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .34s cubic-bezier(.3,1.2,.4,1),background .3s,border-radius .3s}
.tdot.on{background:var(--iris);width:22px;border-radius:4px}

/* ---------- map ---------- */
#mapbox{height:190px;border-radius:16px;overflow:hidden;margin-top:14px;border:1px solid var(--line);background:var(--line)}
.leaflet-container{font:inherit;background:var(--paper)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.75)}
.pinhint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.4}

/* ---------- toast + version ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translate(-50%,90px);
  background:var(--ink);color:#FFF8F7;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;
  z-index:80;transition:transform .34s cubic-bezier(.2,.9,.3,1);max-width:calc(100% - 40px);text-align:center;
}
#toast.show{transform:translate(-50%,0)}
#ver{
  position:fixed;right:9px;bottom:calc(7px + var(--safe-b));z-index:70;
  font-size:10px;font-weight:600;letter-spacing:.05em;color:#C6AEAB;
  font-variant-numeric:tabular-nums;pointer-events:none;
}
/* ---------- opening ---------- */
#splash{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .42s ease, transform .42s cubic-bezier(.3,.8,.3,1);
}
#splash.gone{opacity:0;transform:scale(1.07);pointer-events:none}
#splash svg{overflow:visible}
.sp-track{fill:none;stroke:var(--line);stroke-width:11;opacity:0;animation:spFade .3s .04s forwards}
.sp-arc{
  fill:none;stroke:var(--iris);stroke-width:11;stroke-linecap:round;
  stroke-dasharray:276;stroke-dashoffset:276;
  transform:rotate(-90deg);transform-origin:60px 60px;
  animation:spDraw .8s .1s cubic-bezier(.35,.75,.3,1) forwards;
}
.sp-dot{fill:var(--iris);transform:scale(0);transform-origin:60px 60px;animation:spPop .44s .52s cubic-bezier(.3,1.7,.5,1) forwards}
.sp-word{
  font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.03em;
  opacity:0;transform:translateY(9px);animation:spUp .46s .64s cubic-bezier(.2,.8,.3,1) forwards;
}
.sp-word span{color:var(--iris)}
@keyframes spFade{to{opacity:1}}
@keyframes spDraw{to{stroke-dashoffset:77}}
@keyframes spPop{to{transform:scale(1)}}
@keyframes spUp{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash">
  <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
    <circle class="sp-track" cx="60" cy="60" r="44"/>
    <circle class="sp-arc" cx="60" cy="60" r="44"/>
    <circle class="sp-dot" cx="60" cy="60" r="9"/>
  </svg>
  <div class="sp-word">On My <span>Way</span></div>
</div>

<div id="app">
  <div class="topbar" id="topbar">
    <button class="iconbtn" id="navCal" aria-label="Calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
    <div class="brand">On My <span>Way</span></div>
    <button class="iconbtn" id="navSet" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div id="scr-home" class="screen"></div>
  <div id="scr-cal" class="screen hide"></div>
  <div id="scr-set" class="screen hide"></div>
</div>

<div id="sheetHost"></div>
<div id="toast"></div>
<div id="ver">v1.0.0</div>
<div id="tut" class="hide"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   ON MY WAY — v1.0.0
   A notification-timing layer: the app decides WHEN to tell you.
   Single file. No build step. Host it anywhere over HTTPS.
   ============================================================ */
const VERSION = "1.6.2";

/* ---------- storage (falls back to memory in sandboxed frames) ---------- */
const Store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
  catch (e) { ok = false; }
  return {
    get(k, d) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { ok ? localStorage.setItem(k, s) : (mem[k] = s); } catch (e) { mem[k] = s; }
    }
  };
})();

/* ---------- game feel ---------- */
/**
 * Four layers per press, the way a good game menu does it:
 *   click  — a 30ms bandpassed noise transient, the part your finger "feels"
 *   body   — an FM bell whose modulation index decays, so it goes bright to pure
 *   thump  — a low sine dropping in pitch, the weight underneath
 *   air    — a short bright room so it isn't bone dry
 * Tap fast and the notes climb a pentatonic ladder instead of repeating.
 * Pause for half a second and the ladder resets to the bottom.
 */
const Sound = (() => {
  let ctx = null, room = null, dry = null, noise = null, lastPlay = 0, step = 0, lastTap = 0;
  const on = () => S.settings.sounds !== false;

  function ac() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const L = Math.floor(ctx.sampleRate * 0.4), ir = ctx.createBuffer(2, L, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < L; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 4.5) * 0.3;
    }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.15;
    dry = ctx.createGain(); dry.gain.value = 0.95;
    room = ctx.createGain();
    room.connect(verb); verb.connect(wet); wet.connect(ctx.destination); dry.connect(ctx.destination);
    const N = Math.floor(ctx.sampleRate * 0.03);
    noise = ctx.createBuffer(1, N, ctx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < N; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / N, 3);
    return ctx;
  }
  function out(node, pan) {
    const c = ac();
    if (c.createStereoPanner) {
      const p = c.createStereoPanner(); p.pan.value = pan || 0;
      node.connect(p); p.connect(dry); p.connect(room);
    } else { node.connect(dry); node.connect(room); }
  }

  /** FM voice. index decays over the note, which is what makes a bell a bell. */
  function fm(f, vol, dur, ratio, index, delay, pan) {
    if (!on()) return;
    try {
      const c = ac(); if (c.state === "suspended") c.resume();
      const t = c.currentTime + (delay || 0);
      const car = c.createOscillator(), mod = c.createOscillator();
      const mg = c.createGain(), g = c.createGain();
      car.frequency.setValueAtTime(f, t);
      mod.frequency.setValueAtTime(f * ratio, t);
      mg.gain.setValueAtTime(f * index, t);
      mg.gain.exponentialRampToValueAtTime(Math.max(1, f * index * 0.04), t + dur * 0.55);
      mod.connect(mg); mg.connect(car.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      car.connect(g); out(g, pan);
      mod.start(t); mod.stop(t + dur + .05); car.start(t); car.stop(t + dur + .05);
      lastPlay = performance.now();
    } catch (e) {}
  }
  function click(vol, freq, delay) {
    if (!on()) return;
    try {
      const c = ac(), t = c.currentTime + (delay || 0);
      const s = c.createBufferSource(); s.buffer = noise;
      const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 1.2;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
      s.connect(bp); bp.connect(g); out(g, 0);
      s.start(t); s.stop(t + 0.05);
    } catch (e) {}
  }
  function thump(f, vol, dur, delay) {
    if (!on()) return;
    try {
      const c = ac(), t = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.55, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dry);
      o.start(t); o.stop(t + dur + .03);
    } catch (e) {}
  }

  const LADDER = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];   // pentatonic, two octaves
  const C5 = 523.25;
  function climb() {
    const t = performance.now();
    step = (t - lastTap < 600) ? Math.min(step + 1, LADDER.length - 1) : 0;
    lastTap = t;
    return C5 * Math.pow(2, LADDER[step] / 12);
  }
  const pan = () => Math.random() * 0.36 - 0.18;

  return {
    busy: () => performance.now() - lastPlay < 90,
    prime: () => { try { ac(); } catch (e) {} },
    tap: () => { const f = climb(); click(0.045, 3400); fm(f, 0.07, 0.1, 2, 1.7, 0, pan()); thump(160, 0.035, 0.055); },
    back: () => { click(0.03, 1900); fm(C5 * 0.75, 0.06, 0.13, 1.5, 1.1, 0, 0); thump(120, 0.045, 0.07); },
    open: () => { click(0.035, 2400); fm(C5 * 0.84, 0.065, 0.12, 2, 1.4, 0, -.08); fm(C5 * 1.26, 0.05, 0.13, 2, 1.2, 0.05, .1); thump(150, 0.05, 0.07); },
    on: () => { click(0.05, 3800); fm(C5, 0.07, 0.1, 3.5, 1.8, 0, -.1); fm(C5 * 1.5, 0.06, 0.15, 3.5, 1.4, 0.055, .12); thump(170, 0.04, 0.05); },
    off: () => { click(0.03, 1600); fm(C5 * 0.84, 0.06, 0.1, 1.5, 1, 0, .1); fm(C5 * 0.63, 0.05, 0.16, 1.5, 0.8, 0.055, -.1); thump(110, 0.05, 0.09); },
    ping: () => {
      click(0.05, 4200);
      fm(C5, 0.085, 0.16, 3.5, 2.2, 0, -.14);
      fm(C5 * 1.26, 0.075, 0.18, 3.5, 1.9, 0.085, .05);
      fm(C5 * 1.5, 0.07, 0.3, 3.5, 1.6, 0.17, .16);
      fm(C5 * 3, 0.028, 0.34, 2, 1, 0.19, 0);
      thump(180, 0.05, 0.08);
    }
  };
})();
window.Sound = Sound;

/* ---------- state ---------- */
const DEFAULTS = {
  onboarded: false,
  settings: {
    sounds: true,
    bufferMin: 12,          // comfort padding added to every trip
    quietStart: 21.5,       // no notifications after 9:30pm
    quietEnd: 7,            // or before 7am
    homeworkHour: 18,       // aim assignment alerts for 6pm the day before
    blindLead: 60,          // warning for anything we can't measure a trip to
    sports: false, weather: false, traffic: false, routines: true, emailScan: true, autoAccept: true,
    weatherMorning: true, weatherSevere: true,
    sportsPre: true, sportsScore: false, sportsFinal: true
  },
  keys: { googleClientId: "", mapsKey: "", workerUrl: "" },
  home: null,               // {lat,lng} learned or set
  geo: {},                  // geocode cache, so we ask once per place
  suggestions: [],          // parsed out of email, waiting on your yes
  accounts: [],             // addresses of every Google account you've paired
  vault: [],                // {email, blob} — sealed refresh tokens, only the worker can read them
  banned: {},               // things you deleted on purpose. never coming back.
  teams: [],                // [{league,id,name}]
  events: [],               // unified event objects
  routines: [],             // [{id,title,time:"07:20",days:[1,2,3,4,5],place?}]
  fired: {},                // id -> timestamp
  routeLearning: {},        // destKey -> {ratio, n}
  paired: { google: false, location: false, notifications: false, maps: false }
};
let S = Object.assign({}, DEFAULTS, Store.get("omw", {}));
S.settings = Object.assign({}, DEFAULTS.settings, S.settings || {});
S.keys = Object.assign({}, DEFAULTS.keys, S.keys || {});
S.paired = Object.assign({}, DEFAULTS.paired, S.paired || {});
S.geo = S.geo || {}; S.suggestions = S.suggestions || []; S.vault = S.vault || []; S.banned = S.banned || {};
const save = () => Store.set("omw", S);

/* ---------- time helpers ---------- */
const MIN = 60000;
const now = () => new Date();
const fmtTime = d => new Date(d).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtDay = d => {
  const x = new Date(d), t = new Date(); t.setHours(0, 0, 0, 0);
  const dd = new Date(x); dd.setHours(0, 0, 0, 0);
  const diff = Math.round((dd - t) / 86400000);
  if (diff === 0) return "Today"; if (diff === 1) return "Tomorrow"; if (diff === -1) return "Yesterday";
  return x.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
};
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const relMin = d => Math.round((new Date(d) - now()) / MIN);
function humanGap(mins) {
  if (mins < 1) return "now";
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return h + "h" + (m ? " " + m + "m" : "");
  const d = Math.round(h / 24); return d + " day" + (d > 1 ? "s" : "");
}

/* ============================================================
   THE ENGINE — this is the actual product.
   Everything else is a shell around these three functions.
   ============================================================ */

/** Distance in km between two {lat,lng}. */
function haversine(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/**
 * Travel time in minutes from origin to an event's place.
 * Uses Google Directions (live traffic) when a Maps key is paired,
 * otherwise a road-factored straight-line estimate.
 * Then applies what we've LEARNED about this person on this route.
 */
async function travelMinutes(origin, dest, destKey) {
  let base = null;
  if (!S.paired.maps) {                        // OSRM: real roads, no key, no card
    try {
      const u = "https://router.project-osrm.org/route/v1/driving/" +
        origin.lng.toFixed(5) + "," + origin.lat.toFixed(5) + ";" +
        dest.lng.toFixed(5) + "," + dest.lat.toFixed(5) + "?overview=false";
      const d = await (await fetch(u)).json();
      if (d.code === "Ok" && d.routes && d.routes[0]) base = Math.max(3, Math.round(d.routes[0].duration / 60 * 1.15));
    } catch (e) {}
  }
  if (base == null && S.paired.maps && window.google && google.maps && google.maps.DirectionsService) {
    base = await new Promise(res => {
      try {
        new google.maps.DirectionsService().route({
          origin, destination: dest, travelMode: "DRIVING",
          drivingOptions: { departureTime: new Date(), trafficModel: "bestguess" }
        }, (r, st) => {
          if (st === "OK" && r.routes[0]) {
            const leg = r.routes[0].legs[0];
            res(Math.round((leg.duration_in_traffic || leg.duration).value / 60));
          } else res(null);
        });
      } catch (e) { res(null); }
    });
  }
  if (base == null) {                               // nothing reachable — estimate
    const km = haversine(origin, dest) * 1.32;
    base = Math.max(5, Math.round(km / 38 * 60));
  }
  const L = S.routeLearning[destKey];
  if (L && L.n >= 2) base = Math.round(base * L.ratio);
  return base;
}

/** After a real trip, record how wrong we were so next time is closer. */
function learnRoute(destKey, estimated, actual) {
  const L = S.routeLearning[destKey] || { ratio: 1, n: 0 };
  const r = Math.min(2.5, Math.max(.5, actual / estimated));
  L.ratio = (L.ratio * L.n + r) / (L.n + 1);
  L.n = Math.min(12, L.n + 1);
  S.routeLearning[destKey] = L; save();
}

/**
 * QUIET HOURS. Nothing wakes you up, nothing arrives too late to act on.
 * A notification scheduled inside quiet hours moves to the edge of the window
 * — forward if there's still time, backward if the deadline is close.
 */
function respectQuietHours(when, deadline) {
  const s = S.settings, d = new Date(when), h = d.getHours() + d.getMinutes() / 60;
  const inQuiet = (s.quietStart > s.quietEnd) ? (h >= s.quietStart || h < s.quietEnd) : (h >= s.quietStart && h < s.quietEnd);
  if (!inQuiet) return d;
  const morning = new Date(d);
  if (h < s.quietEnd) morning.setHours(Math.floor(s.quietEnd), (s.quietEnd % 1) * 60, 0, 0);
  else { morning.setDate(morning.getDate() + 1); morning.setHours(Math.floor(s.quietEnd), (s.quietEnd % 1) * 60, 0, 0); }
  if (!deadline || morning < new Date(deadline)) return morning;   // wait until you're awake
  const evening = new Date(d);                                      // deadline is too close — tell you before bed
  if (h >= s.quietStart) evening.setHours(Math.floor(s.quietStart) - 0, (s.quietStart % 1) * 60 - 1, 0, 0);
  else { evening.setDate(evening.getDate() - 1); evening.setHours(Math.floor(s.quietStart), (s.quietStart % 1) * 60 - 1, 0, 0); }
  return evening > now() ? evening : new Date(Date.now() + MIN);
}

/**
 * When should this event be announced?
 * MEETING     -> start − travel − comfort buffer. You get told to LEAVE, not that it exists.
 * ASSIGNMENT  -> 6pm the day before. Never 24h-to-the-minute, because a 3am post
 *                would mean a 3am alert. If the due date is closer than that,
 *                fire soon but still inside waking hours.
 * ROUTINE     -> at its set time, traffic-adjusted if it has a place.
 */
/**
 * Turn a place NAME into coordinates. Calendar events and anything you type
 * arrive as text, and text has no distance. Without this every trip was
 * silently worth zero minutes.
 */
const geoKey = n => String(n || "").toLowerCase().trim().replace(/\s+/g, " ").slice(0, 90);

/**
 * Turn a place NAME into coordinates.
 * Open-Meteo only knows cities, which is why "Bay School of San Francisco"
 * used to land downtown. Photon and Nominatim are both built on OpenStreetMap
 * and know actual buildings — schools, shops, street addresses. Free, no key.
 */
async function geocode(name) {
  if (!name) return null;
  const k = geoKey(name);
  if (S.geo[k]) return S.geo[k];
  const near = ORIGIN || S.home;
  let r = null;

  if (S.paired.maps && window.google && google.maps && google.maps.Geocoder) {
    r = await new Promise(res => {
      try {
        new google.maps.Geocoder().geocode({ address: name }, (x, st) => {
          if (st === "OK" && x[0]) { const l = x[0].geometry.location; res({ lat: l.lat(), lng: l.lng(), label: x[0].formatted_address }); }
          else res(null);
        });
      } catch (e) { res(null); }
    });
  }

  if (!r) {                                    // Photon — knows buildings by name
    try {
      let u = "https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(name);
      if (near) u += "&lat=" + near.lat.toFixed(4) + "&lon=" + near.lng.toFixed(4);
      const d = await (await fetch(u)).json();
      const f = d.features && d.features[0];
      if (f && f.geometry) {
        const p = f.properties || {};
        r = {
          lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0],
          label: [p.name, p.street, p.city].filter(Boolean).join(", ") || name
        };
      }
    } catch (e) {}
  }

  if (!r) {                                    // Nominatim — same data, different index
    try {
      const d = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
        encodeURIComponent(name))).json();
      if (d && d[0]) r = { lat: +d[0].lat, lng: +d[0].lon, label: d[0].display_name };
    } catch (e) {}
  }

  if (!r) {                                    // last resort: the city, roughly
    try {
      const q = name.replace(/^[\d\-\s]+/, "").split(",")[0].trim();
      const d = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(q))).json();
      if (d.results && d.results[0]) r = { lat: d.results[0].latitude, lng: d.results[0].longitude, rough: true, label: d.results[0].name };
    } catch (e) {}
  }

  if (r) { S.geo[k] = r; save(); }
  return r;
}

/** Standing where you are, claim this spot for a name. Beats any lookup. */
function pinPlace(name) {
  const o = ORIGIN;
  if (!o) { toast("Turn location on first"); return; }
  S.geo[geoKey(name)] = { lat: o.lat, lng: o.lng, pinned: true, label: "Pinned from where you stood" };
  S.events.forEach(e => { if (e.place && geoKey(e.place.name) === geoKey(name)) { e.place.lat = o.lat; e.place.lng = o.lng; e.place.rough = false; } });
  save(); Sound.on(); closeSheet();
  toast(name + " pinned exactly");
  rescheduleAll().then(renderHome);
}

async function computeAlert(ev, origin) {
  const start = new Date(ev.start);
  if (ev.kind === "assignment") {
    const target = new Date(start);
    target.setDate(target.getDate() - 1);
    target.setHours(S.settings.homeworkHour, 0, 0, 0);
    const when = (target <= now()) ? new Date(Date.now() + 2 * MIN) : target;
    return { at: respectQuietHours(when, start), travel: 0, reason: "Due " + fmtDay(start) + " at " + fmtTime(start) };
  }
  let travel = 0, reason = "";
  if (ev.place && !ev.place.lat && ev.place.name) {          // resolve text to a point
    const g = await geocode(ev.place.name);
    if (g) { ev.place.lat = g.lat; ev.place.lng = g.lng; ev.place.rough = g.rough; ev.place.pinned = g.pinned; ev.place.label = g.label; }
  }
  if (ev.place && ev.place.lat && origin) {
    travel = await travelMinutes(origin, { lat: ev.place.lat, lng: ev.place.lng }, ev.place.name || ev.title);
    reason = travel + " min of travel plus " + S.settings.bufferMin + " min of slack" +
      (ev.place.rough ? ", from a rough guess at where that is" : "") +
      (S.routeLearning[ev.place.name] && S.routeLearning[ev.place.name].n >= 2 ? ", adjusted to how long this trip really takes you" : "");
  } else if (ev.place && ev.place.name) {
    reason = "Couldn't place " + ev.place.name + " on a map, so a " + humanGap(S.settings.blindLead) + " head start";
  } else if (!origin) {
    reason = "Location is off, so a " + humanGap(S.settings.blindLead) + " head start";
  } else {
    reason = "Nowhere to travel to, so a " + humanGap(S.settings.blindLead) + " head start";
  }
  const lead = travel > 0
    ? travel + S.settings.bufferMin              // we know the distance, use it
    : (S.settings.blindLead || 60);              // we don't, so warn early
  return { at: new Date(start.getTime() - lead * MIN), travel, reason };
}

/** Exactly the format asked for. Blanks only appear when we actually know them. */
function notifText(ev) {
  const mins = relMin(ev.start);
  const kind = ev.kind === "assignment" ? "assignment" : (ev.kind === "routine" ? "reminder" : "meeting");
  if (ev.kind === "assignment")
    return { title: ev.title, body: "Due " + fmtDay(ev.start).toLowerCase() + " at " + fmtTime(ev.start) + (ev.course ? " · " + ev.course : "") };
  let s = "You have a " + kind + " at " + (ev.place && ev.place.name ? ev.place.name : fmtTime(ev.start));
  if (ev.room) s += " in room " + ev.room;
  if (ev.who) s += " with " + ev.who;
  s += " in " + humanGap(Math.max(0, mins)) + ".";
  return { title: ev.title, body: s };
}

/* ---------- did we get it right? ---------- */
let TRIP = null;
function noteDeparture(ev, est) {
  if (!est || !ev.place || !ev.place.lat) return;
  TRIP = { id: ev.id, key: ev.place.name || ev.title, est, left: Date.now() };
}
function checkArrival(pos) {
  if (!TRIP || !pos) return;
  const ev = S.events.find(e => e.id === TRIP.id);
  if (!ev || !ev.place || !ev.place.lat) { TRIP = null; return; }
  if (Date.now() - TRIP.left > 4 * 60 * MIN) { TRIP = null; return; }
  if (haversine(pos, { lat: ev.place.lat, lng: ev.place.lng }) < 0.2) {
    const actual = Math.max(1, Math.round((Date.now() - TRIP.left) / MIN));
    learnRoute(TRIP.key, TRIP.est, actual);
    toast("That took " + actual + " min. Noted for next time.");
    TRIP = null;
  }
}

/* ---------- rebuild every alert time ---------- */
let ORIGIN = null;
async function rescheduleAll() {
  for (const ev of S.events) {
    if (new Date(ev.start) < now() - 6 * 60 * MIN) continue;
    const a = await computeAlert(ev, ORIGIN || S.home);
    ev.alertAt = a.at.toISOString(); ev.travel = a.travel; ev.reason = a.reason;
  }
  S.events.sort((a, b) => new Date(a.start) - new Date(b.start));
  save();
  queueToIDB();
}

/* ---------- delivery loop ---------- */
function deliver(ev) {
  const t = notifText(ev);
  Sound.ping();
  if (S.paired.notifications && "Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification(t.title, { body: t.body, tag: ev.id, badge: "", requireInteraction: false });
      n.onclick = () => { window.focus(); openDetail(ev.id); n.close(); };
    } catch (e) { toast(t.body); }
  } else toast(t.body);
  S.fired[ev.id] = Date.now(); save();
  if (S.settings.traffic) noteDeparture(ev, ev.travel);
  queueToIDB();
}
function tick() {
  const t = Date.now();
  for (const ev of S.events) {
    if (S.fired[ev.id] || !ev.alertAt) continue;
    const at = new Date(ev.alertAt).getTime();
    if (at <= t && t - at < 30 * MIN) deliver(ev);
  }
  IDB.sentIds().then(ids => {
    let ch = false;
    ids.forEach(id => { if (!S.fired[id]) { S.fired[id] = Date.now(); ch = true; } });
    if (ch) save();
  });
  const home = document.getElementById("scr-home");
  if (home && !home.classList.contains("hide")) renderHome();
}

/* ============================================================
   PAIRING — real APIs, real scopes.
   ============================================================ */
const SCOPES = [
  "https://www.googleapis.com/auth/calendar.readonly",
  "https://www.googleapis.com/auth/gmail.readonly",
  "https://www.googleapis.com/auth/classroom.courses.readonly",
  "https://www.googleapis.com/auth/classroom.coursework.me.readonly"
].join(" ");
/** Live access tokens, one per paired account. Held in memory only —
 *  they expire in about an hour, which is why re-pairing is a normal thing. */
let ACCOUNTS = [];
const anyToken = () => ACCOUNTS.length > 0;

const hasWorker = () => !!(S.keys.workerUrl || "").trim();
const workerBase = () => S.keys.workerUrl.trim().replace(/\/+$/, "");

/** Hand the browser off to the worker, which handles Google and sends us back. */
function pairViaWorker() {
  const back = location.href.split("#")[0];
  location.href = workerBase() + "/start?app=" + encodeURIComponent(back);
}

/** Swap a sealed blob for an hour of access. This is the whole point of the worker. */
async function tokenFromWorker(entry) {
  try {
    const r = await fetch(workerBase() + "/token", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ t: entry.blob })
    });

/** Any call that 401s gets one silent refresh and one retry before it fails. */
async function gfetchA(url, acct) {
  try { return await gfetch(url, acct.token); }
  catch (e) {
    if (String(e.message) !== "401") throw e;
    if (!(await refreshAccount(acct.email))) throw e;
    const fresh = ACCOUNTS.find(x => x.email === acct.email);

  }
}

const gfetch = async (url, token) => {

};

/* ---------- reading your email, carefully ---------- */
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const DAYNAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
/** Find a date and time in ordinary sentences. Returns null unless it's confident. */
function parseWhen(text, received) {
  const t = (text || "").toLowerCase();
  const isDue = /\b(due|deadline|submit by|turn it in|turn in|hand in|no later than)\b/.test(t);
  const isMeet = /\b(meeting|meet at|meet up|call|appointment|interview|practice|rehearsal|conference|tryout|orientation|recital)\b/.test(t);
  // plain-English invitations, which is how people actually write
  const isInvite = /\b(want to (go|grab|get|come|meet|see|hang)|wanna|are you free|you free|let'?s (go|grab|meet|get|do)|come over|hang out|join me|pick you up|see you at)\b/.test(t)
    || /\b(dinner|lunch|breakfast|brunch|coffee|movie|concert|party|birthday|game|trip|store)\b/.test(t) && /\?|\bthis\b|\bnext\b|\bon\b/.test(t);
  if (!isDue && !isMeet && !isInvite) return null;
  const base = received ? new Date(received) : new Date();
  let d = null, m;
  if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : base.getFullYear();
    d = new Date(y, +m[1] - 1, +m[2]);
  } else if ((m = t.match(new RegExp("\\b(" + MONTHS.join("|") + ")[a-z]*\\.?\\s+(\\d{1,2})\\b")))) {
    d = new Date(base.getFullYear(), MONTHS.indexOf(m[1]), +m[2]);
    if (d.getTime() < base.getTime() - 30 * 864e5) d.setFullYear(d.getFullYear() + 1);
  } else if (/\btomorrow\b/.test(t)) { d = new Date(base); d.setDate(d.getDate() + 1); }
  else if (/\btonight\b|\btoday\b/.test(t)) { d = new Date(base); }
  else if ((m = t.match(new RegExp("\\b(?:this\\s+|next\\s+)?(" + DAYNAMES.join("|") + ")\\b")))) {
    d = new Date(base);
    let add = (DAYNAMES.indexOf(m[1]) - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + (add || 7));
  }
  if (!d || isNaN(d)) return null;
  const clock = parseClock(t);
  const kind = isDue ? "assignment" : "meeting";
  if (clock) d.setHours(clock.h, clock.m, 0, 0);
  else d.setHours(isDue ? 23 : 9, isDue ? 59 : 0, 0, 0);
  if (d.getTime() < Date.now()) return null;
  return { kind, when: d, exact: !!clock };
}

/** Clock times people actually write, including the ones that are words. */
function parseClock(t) {
  let m;
  if (/\bmidnight\b/.test(t)) return { h: 0, m: 0 };
  if (/\bnoon\b|\bmidday\b/.test(t)) return { h: 12, m: 0 };
  if ((m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m|p\.?m)\b/)))
    return { h: (+m[1] % 12) + (m[3][0] === "p" ? 12 : 0), m: m[2] ? +m[2] : 0 };
  if ((m = t.match(/\b(?:at|around|by)\s+(\d{1,2})(?::(\d{2}))?\b/))) {
    let hh = +m[1];
    if (hh >= 1 && hh <= 7) hh += 12;               // "at 4" means the afternoon
    if (hh > 23) return null;
    return { h: hh, m: m[2] ? +m[2] : 0 };
  }
  if (/\bmorning\b/.test(t)) return { h: 9, m: 0 };
  if (/\bafternoon\b/.test(t)) return { h: 15, m: 0 };
  if (/\bevening\b|\btonight\b/.test(t)) return { h: 19, m: 0 };
  return null;
}

/** Plain-language yes and no. Checked in that order — a "sorry, can't" that
 *  also contains "sounds good" should still count as a no. */
const NO_RE = /\b(can'?t make it|cannot make it|won'?t work|does ?n'?t work|not going to work|unable to|have to decline|need to decline|can'?t do|rain ?check|another time|reschedul|no longer)\b/;
const YES_RE = /\b(yes|yep|yeah|yup|sure|sounds good|sounds great|works for me|that works|see you then|see you there|i'?ll be there|i'?ll come|i'?m in|count me in|confirm(ed|ing)?|perfect|will do|happy to|looking forward)\b/;

/**
 * Look through the whole email thread for a message YOU sent after the
 * proposal, and read it as a yes, a no, or neither.
 */
async function readThread(threadId, acct, afterMs, baseDate) {
  const out = { verdict: null, when: null };
  if (!threadId) return out;
  try {
    const t = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/threads/" + threadId +
      "?format=metadata&metadataHeaders=From", acct);
    const me = String(acct.email || "").toLowerCase();
    for (const m of (t.messages || [])) {
      const when = Number(m.internalDate || 0);
      if (afterMs && when && when <= afterMs) continue;      // only what came after the ask
      const H = {}; (m.payload && m.payload.headers || []).forEach(x => H[x.name.toLowerCase()] = x.value);
      const sentByMe = (m.labelIds || []).includes("SENT") || (H.from || "").toLowerCase().includes(me);
      const s = (m.snippet || "").toLowerCase();

      // a later message can pin down the time the first one left vague
      const clock = parseClock(s);
      if (clock && baseDate) {
        const d = new Date(baseDate);
        d.setHours(clock.h, clock.m, 0, 0);
        if (d.getTime() > Date.now()) out.when = d;
      }
      if (!sentByMe) continue;
      if (NO_RE.test(s)) { out.verdict = "no"; return out; }
      if (YES_RE.test(s) && !out.verdict) out.verdict = "yes";
    }
  } catch (e) { console.warn("thread", e); }
  return out;
}

/**
 * Cheap change detector. getProfile costs 1 quota unit and returns a historyId
 * that changes whenever the mailbox does. Poll this often; only run the real
 * scan (which is ~20 requests) when the number actually moved.
 */
let HIST = {}, SCANNING = false, LASTSCAN = 0;
async function pollGmail(force) {
  if (!anyToken() || S.settings.emailScan === false || SCANNING) return;
  let changed = !!force;
  for (const acct of ACCOUNTS) {
    try {
      const p = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/profile", acct);
      if (p.historyId && HIST[acct.email] !== p.historyId) {
        if (HIST[acct.email]) changed = true;      // first read just sets the baseline
        HIST[acct.email] = p.historyId;
      }
    } catch (e) {}
  }
  if (!changed) return;
  if (Date.now() - LASTSCAN < 20000) return;       // never more than once per 20s
  SCANNING = true;
  try { await scanGmail(); } finally { SCANNING = false; LASTSCAN = Date.now(); }
}

/** Explains, in plain words, why a message did or didn't turn into anything. */
function parseWhy(text) {
  const t = (text || "").toLowerCase();
  const hasWord = /\b(due|deadline|meeting|meet|call|appointment|interview|practice|rehearsal|tryout|want to|wanna|are you free|let'?s|dinner|lunch|coffee|movie|party|game|trip|store)\b/.test(t);
  if (!hasWord) return "nothing that sounded like a plan";
  return "sounded like a plan, but no day I could read";
}
let SCANLOG = { at: null, accounts: [], items: [] };

async function scanGmail() {
  if (!anyToken() || S.settings.emailScan === false) return;
  const dropped = Store.get("omw_dismissed", {});
  const found = [], autoAdd = [];
  SCANLOG = { at: Date.now(), accounts: [], items: [] };
  for (const acct of ACCOUNTS) {
    const tag = "m" + Math.abs(hashStr(acct.email)) + "_";
    try {
      const l = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=18&q=" +
        encodeURIComponent("newer_than:10d -category:promotions -category:social"), acct);
      SCANLOG.accounts.push({ email: acct.email, count: (l.messages || []).length, error: null });
      for (const msg of (l.messages || []).slice(0, 18)) {
        const id = tag + msg.id;
        if (dropped[id] || S.banned[id] || S.events.some(e => e.id === id)) continue;
        let d;
        try {
          d = await gfetchA("https://gmail.googleapis.com/gmail/v1/users/me/messages/" + msg.id +
            "?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date", acct);
        } catch (e) { console.warn("message", e); continue; }
        const H = {}; (d.payload && d.payload.headers || []).forEach(x => H[x.name.toLowerCase()] = x.value);
        const blob = (H.subject || "") + ". " + (d.snippet || "");
        const hit = parseWhen(blob, H.date);
        if (!hit) { SCANLOG.items.push({ subject: H.subject || "(no subject)", why: parseWhy(blob) }); continue; }
        const item = {
          id, src: "gmail", account: acct.email, kind: hit.kind, title: H.subject || "(no subject)",
          start: hit.when.toISOString(),
          who: (H.from || "").replace(/<[^>]*>/, "").replace(/"/g, "").trim() || null,
          why: "From email: " + (d.snippet || "").slice(0, 170)
        };
        if (hit.kind === "meeting") {
          let th = { verdict: null, when: null };
          try { th = await readThread(msg.threadId, acct, Number(d.internalDate || 0), hit.when); }
          catch (e) { console.warn("thread read", e); }
          if (th.when) {                              // a reply nailed down the time
            item.start = th.when.toISOString();
            item.why = "Time taken from a later reply. " + item.why;
          }
          const verdict = S.settings.autoAccept === false ? null : th.verdict;
          if (verdict === "no") {                       // you turned it down — stop asking
            dropped[id] = 1; Store.set("omw_dismissed", dropped);
            SCANLOG.items.push({ subject: item.title, why: "you replied that you can't make it" });
            continue;
          }
          if (verdict === "yes") {
            item.src = "gmail-auto"; item.auto = true;
            item.why = "Added on its own because you replied yes. " + item.why;
            autoAdd.push(item);
            SCANLOG.items.push({ subject: item.title, why: "added — you replied yes" });
            continue;
          }
        }
        found.push(item);
        SCANLOG.items.push({ subject: item.title, why: "suggested, waiting on you" });
      }
    } catch (e) {
      console.warn("gmail", acct.email, e);
      const rec = SCANLOG.accounts.find(a => a.email === acct.email);
      const msg = String(e.message) === "401" ? "sign-in expired, tap to reconnect" : "error " + e.message;
      rec ? (rec.error = msg) : SCANLOG.accounts.push({ email: acct.email, count: 0, error: msg });
    }
  }
  S.suggestions = found;
  if (autoAdd.length) {
    S.events = S.events.concat(autoAdd);
    save();
    await rescheduleAll();
    autoAdd.forEach(e => pushLocal("auto_" + e.id, "Added to your day",
      e.title + " — " + fmtDay(e.start) + " at " + fmtTime(e.start) + ", because you replied yes"));
  }
  save(); renderHome();
}
function acceptSuggestion(id) {
  const s = S.suggestions.find(x => x.id === id); if (!s) return;
  S.events.push(Object.assign({}, s, { src: "gmail-ok" }));
  S.suggestions = S.suggestions.filter(x => x.id !== id);
  Sound.on(); rescheduleAll().then(renderHome); toast("Added");
}
function dismissSuggestion(id) {
  const dropped = Store.get("omw_dismissed", {}); dropped[id] = 1; Store.set("omw_dismissed", dropped);
  S.suggestions = S.suggestions.filter(x => x.id !== id); save(); Sound.off(); renderHome();
}

/* ---------- the queue the service worker reads ---------- */
const IDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    if (!("indexedDB" in window)) return rej("unsupported");
    const r = indexedDB.open("omw", 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("q")) r.result.createObjectStore("q", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    async sync(items) {
      try {
        const db = await open(), tx = db.transaction("q", "readwrite"), st = tx.objectStore("q");
        const old = await new Promise(r => { const g = st.getAll(); g.onsuccess = () => r(g.result || []); g.onerror = () => r([]); });
        const sent = {}; old.forEach(o => { if (o.sent) sent[o.id] = o.sent; });
        st.clear();
        items.forEach(i => st.put(Object.assign({}, i, { sent: sent[i.id] || null })));
        return new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
      } catch (e) {}
    },
    async sentIds() {
      try {
        const db = await open();
        return await new Promise(r => {
          const g = db.transaction("q", "readonly").objectStore("q").getAll();
          g.onsuccess = () => r((g.result || []).filter(x => x.sent).map(x => x.id));
          g.onerror = () => r([]);
        });
      } catch (e) { return []; }
    }
  };
})();
function queueToIDB() {
  try {
    const items = upcoming().filter(e => e.alertAt && !S.fired[e.id]).slice(0, 40).map(e => {
      const t = notifText(e);
      return { id: e.id, title: t.title, body: t.body, at: new Date(e.alertAt).getTime(), urgent: e.kind !== "assignment" };
    });
    IDB.sync(items);
  } catch (e) {}
}

const paint = s => { if (s === "home") renderHome(); else if (s === "cal") renderCal(); else renderSettings(); };
function go(s) {
  if (SWAPPING) return;
  if (!Sound.busy()) Sound.tap();
  if (s === SCREEN) { paint(s); return; }
  const cur = $("scr-" + SCREEN), next = $("scr-" + s);
  const dir = ORDER[s] > ORDER[SCREEN] ? 1 : -1;

/* ---------- HOME ---------- */
function upcoming() {
  const cut = Date.now() - 30 * MIN;
  return S.events.filter(e => new Date(e.start).getTime() > cut && !S.banned[e.id])
    .concat(routineEvents().filter(e => !S.banned[e.id]))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}
function routineEvents() {
  if (!S.settings.routines) return [];
  const out = [];
  for (let d = 0; d < 7; d++) {
    const day = new Date(); day.setDate(day.getDate() + d);
    S.routines.forEach(r => {
      if (!r.days.includes(day.getDay())) return;
      const [h, m] = r.time.split(":").map(Number);
      const dt = new Date(day); dt.setHours(h, m, 0, 0);
      if (dt.getTime() < Date.now() - 20 * MIN) return;
      out.push({ id: "r_" + r.id + "_" + dt.toDateString(), kind: "routine", src: "routine", title: r.title, start: dt.toISOString(), alertAt: dt.toISOString(), reason: "Daily reminder" });
    });
  }
  return out;
}

    const total = 120, pct = Math.max(0, Math.min(1, 1 - mins / total));

    const big = mins < 60 ? mins : Math.round(mins / 60);

    h += `<div class="eyebrow">Next up</div>

      h += `<div class="card" style="margin-bottom:10px">
        <div class="card-t">${esc(s.title)}</div>

        <span class="tag t-${s.kind}">${s.kind}</span>

          <button class="btn ghost" style="flex:1;padding:10px;font-size:14px" onclick="dismissSuggestion('${s.id}')">Not an event</button>

  if (rest.length) {

        </button></div>`;

    h += `</div>`;

/* ---------- a real map, from OpenStreetMap. no key, no card. ---------- */
let MAP = null, LEAFLET = null;
function loadLeaflet() {
  if (LEAFLET) return LEAFLET;
  LEAFLET = new Promise((res, rej) => {
    if (window.L) return res(window.L);
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = () => res(window.L);
    s.onerror = () => rej("offline");
    document.head.appendChild(s);
  });
  return LEAFLET;
}

async function drawMap(ev) {
  const host = document.getElementById("mapbox");
  if (!host || !ev.place || !ev.place.lat) return;
  let L;
  try { L = await loadLeaflet(); } catch (e) { host.remove(); return; }
  if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; }

  const dest = [ev.place.lat, ev.place.lng];
  const here = (ORIGIN || S.home) ? [(ORIGIN || S.home).lat, (ORIGIN || S.home).lng] : null;
  MAP = L.map(host, { zoomControl: false, attributionControl: true }).setView(dest, 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "© OpenStreetMap"
  }).addTo(MAP);

  const dot = (color, r) => L.divIcon({
    className: "", iconSize: [r * 2, r * 2], iconAnchor: [r, r],
    html: `<div style="width:${r * 2}px;height:${r * 2}px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)"></div>`
  });

  const marker = L.marker(dest, { icon: dot("#D96A62", 9), draggable: true }).addTo(MAP);
  marker.on("dragend", () => {
    const p = marker.getLatLng();
    S.geo[geoKey(ev.place.name)] = { lat: p.lat, lng: p.lng, pinned: true, label: "Placed by hand" };
    S.events.forEach(x => { if (x.place && geoKey(x.place.name) === geoKey(ev.place.name)) { x.place.lat = p.lat; x.place.lng = p.lng; x.place.rough = false; x.place.pinned = true; } });
    save(); Sound.on(); toast("Moved — that's where it is now");
    rescheduleAll().then(renderHome);
  });

  if (here) {
    L.marker(here, { icon: dot("#6FA890", 7) }).addTo(MAP);
    MAP.fitBounds(L.latLngBounds([here, dest]).pad(0.3));
    try {                                        // the actual road route, from OSRM
      const u = "https://router.project-osrm.org/route/v1/driving/" +
        here[1].toFixed(5) + "," + here[0].toFixed(5) + ";" +
        dest[1].toFixed(5) + "," + dest[0].toFixed(5) + "?overview=full&geometries=geojson";
      const d = await (await fetch(u)).json();
      if (d.code === "Ok" && d.routes[0]) {
        const line = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        L.polyline(line, { color: "#D96A62", weight: 4, opacity: .85 }).addTo(MAP);
        MAP.fitBounds(L.latLngBounds(line).pad(0.15));
      }
    } catch (e) {}
  }
  setTimeout(() => { try { MAP.invalidateSize(); } catch (e) {} }, 120);
}

/* ---------- CALENDAR ---------- */
let CAL = new Date(), SEL = new Date();
function renderCal() {
  const y = CAL.getFullYear(), m = CAL.getMonth();
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const all = upcoming();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dim = d.getMonth() !== m, today = sameDay(d, new Date()), sel = sameDay(d, SEL);
    const n = all.filter(e => sameDay(e.start, d)).length;
    cells += `<button class="day${dim ? " dim" : ""}${today ? " today" : ""}${sel ? " sel" : ""}" onclick="pickDay('${d.toISOString()}')">
      <span>${d.getDate()}</span><span class="pips">${Array(Math.min(n, 3)).fill('<i class="pip"></i>').join("")}</span></button>`;
  }
  const dayEvents = all.filter(e => sameDay(e.start, SEL));
  $("scr-cal").innerHTML = `
    <div class="cal-head">
      <div class="cal-title">${CAL.toLocaleDateString([], { month: "long", year: "numeric" })}</div>
      <button class="iconbtn" onclick="shiftMonth(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="iconbtn" onclick="shiftMonth(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="grid">${["S", "M", "T", "W", "T", "F", "S"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="eyebrow">${fmtDay(SEL)}</div>
    ${dayEvents.length ? dayEvents.map(e => `<div class="item"><button class="card" onclick="openDetail('${e.id}')">
        <div class="card-t">${esc(e.title)}</div>
        <div class="card-s">${fmtTime(e.start)}${e.place && e.place.name ? " · " + esc(e.place.name) : ""}</div>
        <span class="tag t-${e.kind}">${e.kind}</span></button></div>`).join("")
      : `<div class="empty"><p style="margin:0">Nothing on this day.</p></div>`}
    <button class="btn full" style="margin-top:14px" onclick="addForm()">Add to this day</button>
    <div style="height:26px"></div>`;
}
function pickDay(iso) { SEL = new Date(iso); Sound.tap(); renderCal(); }
function shiftMonth(n) { CAL.setMonth(CAL.getMonth() + n); Sound.tap(); renderCal(); }

    { id: "d3", src: "demo", kind: "meeting", title: "Baseball practice", start: mk(16, 0, 1), place: { name: "Moscone Rec Center, San Francisco", lat: 37.8003, lng: -122.4360 }, who: "Coach" },
    { id: "d4", src: "demo", kind: "assignment", title: "Earth science lab writeup", course: "Earth Science", start: mk(23, 59, 3) },
    { id: "d5", src: "demo", kind: "meeting", title: "Dentist", start: mk(9, 30, 4), place: { name: "2000 Van Ness Ave, San Francisco", lat: 37.7930, lng: -122.4224 } }
  ];
  if (!S.home) S.home = { lat: 37.7749, lng: -122.4194 };
  S.fired = {};
  await rescheduleAll(); Sound.on(); toast("Sample day loaded"); go("home");
}

/* ---------- TUTORIAL ---------- */
const TUT = [
  { art: ringArt(), t: "It decides when", p: "Every other app tells you a thing exists. This one works out the moment that thing becomes useful to know, and stays quiet until then." },
  { art: leaveArt(), t: "Leave by, not starts at", p: "Pair your calendar and location and it subtracts the drive, the traffic and a few minutes of slack. The number you see is when to walk out the door." },
  { art: nightArt(), t: "No 3am homework alerts", p: "An assignment posted at 3am is still due tomorrow. You'll hear about it at six the evening before, when you can actually do something about it." },
  { art: pairArt(), t: "Pair what you use", p: "Calendar, Gmail, Classroom, Maps, weather, sports. Everything stays on this device. Add and remove any of it whenever you want." }
];
function ringArt() {
  return `<svg viewBox="0 0 160 160" width="160" height="160"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--line)" stroke-width="11"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="var(--iris)" stroke-width="11" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="130" transform="rotate(-90 80 80)"/>
  <text x="80" y="76" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="42" fill="var(--ink)">18</text>
  <text x="80" y="98" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" letter-spacing="1.6" fill="var(--muted)">MIN</text></svg>`;
}
function leaveArt() {
  return `<svg viewBox="0 0 220 150" width="220" height="150">
  <rect x="8" y="20" width="204" height="46" rx="14" fill="var(--card)" stroke="var(--line)"/>
  <text x="24" y="41" font-family="Inter" font-weight="700" font-size="10" letter-spacing="1.4" fill="var(--muted)">STARTS AT</text>
  <text x="24" y="59" font-family="Bricolage Grotesque" font-weight="800" font-size="19" fill="#C6B0AD">3:00 PM</text>
  <rect x="8" y="80" width="204" height="52" rx="14" fill="var(--iris-soft)" stroke="var(--iris)"/>
  <text x="24" y="102" font-family="Inter" font-weight="700" font-size="10" letter-spacing="1.4" fill="var(--iris)">LEAVE BY</text>
  <text x="24" y="122" font-family="Bricolage Grotesque" font-weight="800" font-size="22" fill="var(--iris)">2:31 PM</text>
  <text x="196" y="118" text-anchor="end" font-family="Inter" font-size="10.5" fill="var(--iris)">17 min + 12 slack</text></svg>`;
}
function nightArt() {
  return `<svg viewBox="0 0 220 140" width="220" height="140">
  <line x1="16" y1="96" x2="204" y2="96" stroke="var(--line)" stroke-width="2"/>
  <rect x="16" y="60" width="70" height="36" fill="#F4ECEA" opacity=".85"/>
  <text x="51" y="116" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" fill="var(--muted)">3am</text>
  <circle cx="51" cy="78" r="7" fill="none" stroke="#C6B0AD" stroke-width="2"/>
  <line x1="45" y1="84" x2="57" y2="72" stroke="#C6B0AD" stroke-width="2"/>
  <text x="160" y="116" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" fill="var(--iris)">6pm</text>
  <circle cx="160" cy="78" r="9" fill="var(--iris)"/>
  <path d="M156 78l3 3 6-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M62 40 Q110 18 150 56" stroke="var(--iris)" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="m146 50 5 7-8 2" fill="var(--iris)"/></svg>`;
}
function pairArt() {
  const c = ["var(--iris)", "var(--mint)", "var(--amber)", "var(--coral)"];
  return `<svg viewBox="0 0 200 140" width="200" height="140">
  <circle cx="100" cy="70" r="26" fill="var(--iris)"/><text x="100" y="76" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="17" fill="#fff">OMW</text>
  ${[[30, 30], [170, 30], [30, 112], [170, 112]].map((p, i) => `<line x1="100" y1="70" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="15" fill="var(--card)" stroke="${c[i]}" stroke-width="2.5"/>`).join("")}</svg>`;
}
let TI = 0, TUTBUSY = false;
function startTutorial(replay) {
  TI = 0; TUTBUSY = false;
  const t = $("tut");
  t.classList.remove("hide", "gone");
  document.body.style.overflow = "hidden";
  if (replay) closeSheet();
  drawTut(1);
}
function drawTut(dir) {
  const s = TUT[TI];
  $("tut").style.setProperty("--td", dir || 1);
  $("tut").innerHTML = `<div class="tut-in" style="animation:tutIn .34s cubic-bezier(.2,.7,.3,1) both">
    <div class="tut-art">${s.art}</div>
    <div class="tut-step">Step ${TI + 1} of ${TUT.length}</div>
    <h1 class="tut-h">${s.t}</h1><p class="tut-p">${s.p}</p></div>
    <div class="tut-foot">
      <div class="dots">${TUT.map((_, i) => `<div class="tdot${i === TI ? " on" : ""}"></div>`).join("")}</div>
      ${TI > 0 ? `<button class="btn ghost" onclick="tutStep(-1)">Back</button>` : ""}
      <button class="btn" onclick="tutStep(1)">${TI === TUT.length - 1 ? "Start" : "Next"}</button>
    </div>`;
}
function tutStep(n) {
  if (TUTBUSY) return;
  const t = $("tut");
  if (TI + n >= TUT.length) {                       // last card: dissolve into the app
    TUTBUSY = true; Sound.on();
    S.onboarded = true; save();
    t.classList.add("gone");
    document.body.style.overflow = "";
    SCREEN = "home"; go("set");
    setTimeout(() => { t.classList.add("hide"); t.innerHTML = ""; TUTBUSY = false; toast("Pair an app to begin"); }, 460);
    return;
  }
  TUTBUSY = true; Sound.tap();
  const dir = n > 0 ? 1 : -1;
  t.style.setProperty("--td", dir);
  const leaving = t.querySelector(".tut-in");
  if (leaving) leaving.style.animation = "tutOut .2s ease forwards";
  setTimeout(() => { TI += n; drawTut(dir); TUTBUSY = false; }, 190);
}

/* ---------- boot ---------- */
$("navCal").onclick = () => go(SCREEN === "cal" ? "home" : "cal");
$("navSet").onclick = () => go(SCREEN === "set" ? "home" : "set");
document.addEventListener("scroll", () => $("topbar").classList.toggle("scrolled", window.scrollY > 6), { passive: true });
// bubbles, so a handler's own sound wins and this stays quiet
document.addEventListener("click", e => {
  if (e.target.closest(".card,.iconbtn,.btn,.row,.day,.sw") && !Sound.busy()) Sound.tap();
});
// browsers won't start audio until you touch the screen once
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => Sound.prime(), { once: true, passive: true }));
$("ver").textContent = "v" + VERSION;

let SWREG = null, BG = false, INSTALL = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL = e; if (SCREEN === "set") renderSettings(); });
function installApp() {
  if (INSTALL) { INSTALL.prompt(); INSTALL = null; return; }
  if (BG) { toast("Already on — alerts arrive with the app closed"); return; }
  toast("Open your browser menu and choose Add to Home Screen");
}
async function initSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  try {
    SWREG = await navigator.serviceWorker.register("./sw.js");
    navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open) openDetail(e.data.open); });
    if ("periodicSync" in SWREG) {
      try {
        const st = await navigator.permissions.query({ name: "periodic-background-sync" });
        if (st.state === "granted") { await SWREG.periodicSync.register("omw-check", { minInterval: 15 * 60000 }); BG = true; }
      } catch (e) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && SWREG && SWREG.active) SWREG.active.postMessage("check");
      if (!document.hidden && SWREG) SWREG.update().catch(() => {});
    });
    SWREG.addEventListener("updatefound", () => {
      const w = SWREG.installing;
      if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) {
          toast("New version ready — reopen the app to load it");
        }
      });
    });
  } catch (e) { console.warn("sw", e); }
}

function dropSplash() {
  const sp = document.getElementById("splash");
  if (!sp) return;
  setTimeout(() => {
    sp.classList.add("gone");
    setTimeout(() => sp.remove(), 460);
  }, 1050);
}

(async function boot() {
  dropSplash();
  initSW();
  await catchWorkerReturn();
  if (!S.onboarded) startTutorial(false);
  if (S.paired.location && navigator.permissions) {
    try { const st = await navigator.permissions.query({ name: "geolocation" }); if (st.state === "granted") pairLocation(); } catch (e) {}
  }
  if (S.paired.maps && S.keys.mapsKey) pairMaps();
  await rescheduleAll();
  renderHome();
  if (S.settings.weather) loadWeather();
  if (S.settings.sports) loadSports();
  const hash = location.hash.match(/e=([^&]+)/);
  if (hash) setTimeout(() => openDetail(decodeURIComponent(hash[1])), 400);
  setInterval(tick, 20000);
  setInterval(() => { if (S.settings.sports) loadSports(); if (S.settings.weather) loadWeather(); }, 10 * 60000);
  setInterval(() => { if (anyToken()) syncGoogle().then(renderHome); }, 4 * 60000);
  setInterval(() => { if (anyToken() || S.vault.length) refreshAll(); }, 40 * 60000);   // ahead of the 1h expiry
  setInterval(() => pollGmail(), 30000);                  // 1 unit per account
  setInterval(() => pollGmail(true), 10 * 60000);         // safety net
  document.addEventListener("visibilitychange", async () => {   // you just opened it
    if (document.hidden) return;
    if (!anyToken() && (S.accounts || []).length) await refreshAll();
    if (!anyToken()) return;
    pollGmail(true);
    syncGoogle().then(renderHome);
  });
  if (S.vault.length && !anyToken()) refreshAll().then(ok => { if (ok) { syncGoogle().then(renderHome); renderSettings(); } });
  if ((S.accounts || []).length && !S.vault.length && !anyToken()) {   // reconnect on launch
    setTimeout(async () => {
      if (await refreshAll()) { toast("Reconnected"); await syncGoogle(); renderHome(); }
    }, 1200);
  }
})();

</script>
